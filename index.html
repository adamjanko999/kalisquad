<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d130e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="KaliSquad - kalistenika s partou. Tréninky na hrazdách, jídlo, progres a žebříček s kámoši.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>KaliSquad - kalistenika s partou</title>
<style>
  :root{
    --bg:#0d130e; --bg2:#131b13; --card:#18231a; --card2:#1f2e20;
    --line:#2b3d2c; --txt:#ece4d4; --mut:#9cab94;
    --acc:#8fc878; --acc2:#5f9e54; --accD:#3a5f37;
    --wood:#b08358; --wood2:#d2a878;
    --blue:#86aec2; --orange:#d99a5b; --red:#cf7a6b; --gold:#d9a441;
    --r:18px; --rs:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45;}
  body{padding-bottom:84px; min-height:100vh;
    background:linear-gradient(180deg,#0d130e 0%,#10170f 60%,#121810 100%);}
  #app{max-width:680px;margin:0 auto;padding:0 14px;}
  @media(min-width:900px){ #app{max-width:760px} }

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(13,19,14,.93);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .hwrap{max-width:680px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px;}
  @media(min-width:900px){ .hwrap{max-width:760px} }
  .logo{font-weight:800;font-size:18px;letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .logo span{color:var(--acc)}
  .hstat{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
  .flame{color:var(--orange)} .xpchip{color:var(--acc)}
  .gear{background:none;border:none;font-size:19px;cursor:pointer;padding:2px}
  .lvlbarWrap{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 14px;max-width:680px}
  @media(min-width:900px){ .lvlbarWrap{max-width:760px;margin:0 auto} }
  .lvlbar{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0%;transition:width .5s}

  /* ---------- nav ---------- */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(13,19,14,.97);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);}
  .nwrap{max-width:680px;margin:0 auto;display:flex;}
  @media(min-width:900px){ .nwrap{max-width:760px} }
  nav button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;font-weight:600;
    padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  nav button .ic{font-size:21px;line-height:1}
  nav button.on{color:var(--acc)}

  /* ---------- shared ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin:14px 0;}
  .card.flat{margin:10px 0}
  .card.wood{border-left:4px solid var(--wood)}
  h1{font-size:24px;margin:18px 0 4px;font-weight:800}
  h2{font-size:17px;margin:0 0 10px;font-weight:700}
  h3{font-size:15px;margin:0 0 6px;font-weight:700}
  .sub{color:var(--mut);font-size:13.5px;margin:0 0 6px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:380px){.grid2{grid-template-columns:1fr}}
  .acc{color:var(--acc)} .mut{color:var(--mut)} .gold{color:var(--gold)}
  .blue{color:var(--blue)} .org{color:var(--orange)} .red{color:var(--red)} .wd{color:var(--wood2)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg,var(--acc2),var(--acc));color:#122112;font-weight:800;
    border:none;border-radius:14px;padding:13px 20px;font-size:15.5px;cursor:pointer;
    width:100%;transition:transform .08s;}
  .btn:active{transform:scale(.97)}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.wood{background:linear-gradient(135deg,#8a6240,var(--wood));color:#1c130b}
  .btn.ghost{background:none;border:1px dashed var(--line);color:var(--mut)}
  .btn.sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:10px}
  .btn.danger{background:none;border:1px solid #5b3530;color:var(--red)}
  input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);
    border-radius:var(--rs);color:var(--txt);padding:12px 13px;font-size:16px;outline:none;
    font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 5px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
    border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--mut)}
  .pill.g{color:var(--acc);border-color:var(--accD)}
  .pill.b{color:var(--blue)} .pill.o{color:var(--orange)} .pill.r{color:var(--red)}
  .pill.w{color:var(--wood2);border-color:#5c452f}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;background:none;border:none;color:var(--mut);font-weight:700;font-size:13.5px;
    padding:9px 4px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#122112}
  .list .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .list .item:last-child{border-bottom:none}
  .emo{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;
    align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .hidden{display:none!important}
  .center{text-align:center}
  .progressbar{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .progressbar>div{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
  .divider{height:1px;background:var(--line);margin:12px 0}
  .chartbox{overflow-x:auto}
  svg text{font-family:inherit}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--acc);
    color:#122112;font-weight:800;padding:11px 20px;border-radius:99px;z-index:99;
    box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .25s;pointer-events:none;
    font-size:14.5px;white-space:nowrap}
  .toast.show{opacity:1}
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:80;display:flex;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
  @media(min-width:700px){.modalBg{align-items:center}}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;
    width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:20px 18px 30px}
  @media(min-width:700px){.modal{border-radius:22px;max-width:520px}}
  .modal h2{font-size:19px}
  .setrow{display:flex;align-items:center;gap:10px;margin:8px 0}
  .setrow .n{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
  .setrow input{text-align:center;font-weight:800;font-size:18px;padding:9px}
  .checkbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg2);color:var(--mut);font-size:19px;cursor:pointer;flex-shrink:0}
  .checkbtn.on{background:var(--acc);color:#122112;border-color:var(--acc)}
  .habit{display:flex;align-items:center;gap:12px;padding:10px 0}
  .quote{font-size:16.5px;font-weight:600;font-style:italic;line-height:1.5}
  .bigEmoji{font-size:46px;text-align:center;margin:8px 0}
  .feelrow{display:flex;justify-content:space-between;gap:6px;margin:14px 0}
  .feelrow button{flex:1;font-size:27px;background:var(--bg2);border:1px solid var(--line);
    border-radius:14px;padding:10px 0;cursor:pointer;filter:grayscale(1);transition:all .15s}
  .feelrow button.on{filter:none;border-color:var(--acc);background:var(--card2);transform:scale(1.08)}
  .lb{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .lb:last-child{border:none}
  .lb .rank{width:30px;font-weight:800;font-size:17px;text-align:center}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--wood),var(--acc2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#122112;flex-shrink:0}
  .stepdots{display:flex;gap:7px;justify-content:center;margin:14px 0}
  .stepdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .stepdots i.on{background:var(--acc);width:22px;border-radius:99px}
  .onb{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:20px 0}
  .goalcard{border:2px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;margin:9px 0;
    display:flex;gap:13px;align-items:center;background:var(--card)}
  .goalcard.on{border-color:var(--acc);background:var(--card2)}
  .goalcard .t{font-weight:800;font-size:15.5px}
  .goalcard .d{font-size:13px;color:var(--mut)}
  .resttimer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
  textarea{min-height:70px;resize:vertical}
  .codebox{background:var(--bg2);border:1px dashed var(--accD);border-radius:var(--rs);
    padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;
    color:var(--acc);max-height:110px;overflow-y:auto}
  .statmini{background:var(--card2);border-radius:var(--rs);padding:12px;text-align:center}
  .statmini .v{font-size:21px;font-weight:800}
  .statmini .l{font-size:11.5px;color:var(--mut);font-weight:700;margin-top:2px}
  .exdone{opacity:.55}
  .achgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ach{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
  .ach.lock{opacity:.35;filter:grayscale(1)}
  .ach .e{font-size:26px}
  .ach .n{font-size:11.5px;font-weight:700;margin-top:4px;line-height:1.25}
  .glassrow{display:flex;gap:6px;margin:10px 0 4px}
  .glassrow button{flex:1;font-size:22px;background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:7px 0;cursor:pointer;opacity:.3;transition:all .12s}
  .glassrow button.full{opacity:1;border-color:var(--blue);background:var(--card2)}
  .warmup{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:4px 12px;margin:8px 0}
  .warmup label{display:flex;align-items:center;gap:10px;margin:0;padding:8px 0;font-size:14px;
    color:var(--txt);font-weight:500;cursor:pointer;border-bottom:1px solid var(--line)}
  .warmup label:last-child{border:none}
  .warmup input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc2);flex-shrink:0}
  details summary{cursor:pointer;font-weight:700;font-size:15px;padding:4px 0;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .minule{background:rgba(176,131,88,.12);border:1px solid #4a3826;border-radius:9px;
    padding:6px 10px;font-size:13px;color:var(--wood2);margin:6px 0 2px}
  .emopick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:4px 0 2px}
  .emopick button{font-size:20px;padding:6px 0;background:var(--bg2);border:1px solid var(--line);
    border-radius:8px;cursor:pointer}
  .emopick button.on{border-color:var(--acc);background:var(--card2)}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
  .confetti i{position:absolute;width:9px;height:14px;top:-20px;animation:fall 2.6s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<header id="hdr" class="hidden">
  <div class="hwrap">
    <div class="logo" onclick="go('home')">
      <svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="5" width="2" height="15" rx="1" fill="#b08358"/><rect x="19" y="5" width="2" height="15" rx="1" fill="#b08358"/><rect x="2" y="4" width="20" height="2.4" rx="1.2" fill="#9aa3a8"/><circle cx="12" cy="10" r="2.2" fill="#ece4d4"/><path d="M9 6.5 L10.7 9 M15 6.5 L13.3 9 M12 12.2 V16 M12 16 L9.8 19.5 M12 16 L14.2 19.5" stroke="#ece4d4" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      Kali<span>Squad</span>
    </div>
    <div class="hstat">
      <span class="flame">🔥 <span id="hStreak">0</span></span>
      <span class="xpchip">⚡ <span id="hXp">0</span></span>
      <button class="gear" onclick="openSettings()" title="Nastavení">⚙️</button>
    </div>
  </div>
  <div class="lvlbarWrap"><div class="lvlbar" id="hLvlBar"></div></div>
</header>

<div id="app"></div>

<nav id="nav" class="hidden">
  <div class="nwrap">
    <button data-v="home"><span class="ic">🌲</span>Dnes</button>
    <button data-v="train"><span class="ic">🏋️</span>Trénink</button>
    <button data-v="food"><span class="ic">🍗</span>Jídlo</button>
    <button data-v="progress"><span class="ic">📈</span>Progres</button>
    <button data-v="squad"><span class="ic">👥</span>Parta</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   KaliSquad v2 - kalistenika, jídlo, progres, parta
   Data jsou lokálně v zařízení (localStorage).
   ===================================================== */

const DB = 'kalisquad_v1';

/* ---------- preset cviky (unit: 'r' = opakování, 's' = sekundy) ---------- */
const EXERCISES = [
 {id:'pushup',   name:'Kliky',                emo:'🤜', cat:'push', lvl:1, unit:'r', easier:'kneepush', harder:'declpush', tip:'Tělo zpevněné v prkně, lokty cca 45° od těla, hrudník až k zemi.'},
 {id:'kneepush', name:'Kliky na kolenou',     emo:'🦵', cat:'push', lvl:0, unit:'r', harder:'pushup', tip:'Lehčí varianta kliků. Boky drž v ose s tělem, nezvedej zadek.'},
 {id:'declpush', name:'Kliky s nohama nahoře',emo:'⛰️', cat:'push', lvl:2, unit:'r', easier:'pushup', harder:'archpush', tip:'Nohy na lavičce. Větší zátěž na ramena a horní prsa.'},
 {id:'archpush', name:'Archer kliky',         emo:'🏹', cat:'push', lvl:3, unit:'r', easier:'declpush', tip:'Široký úchop, klesej k jedné ruce. Příprava na klik na jedné ruce.'},
 {id:'pikepush', name:'Pike kliky',           emo:'🔺', cat:'push', lvl:2, unit:'r', easier:'pushup', harder:'hspu', tip:'Zadek nahoru do stříšky, hlava míří k zemi mezi ruce. Buduje ramena na stojku.'},
 {id:'hspu',     name:'Stojka u zdi (výdrž)', emo:'🤸', cat:'push', lvl:3, unit:'s', easier:'pikepush', tip:'Stojka břichem ke zdi, zpevněné tělo. Měř sekundy výdrže.'},
 {id:'dips',     name:'Dipy',                 emo:'🆙', cat:'push', lvl:2, unit:'r', easier:'benchdip', harder:'muscleup', tip:'Na bradlech. Lokty dozadu, dolů aspoň do 90°.'},
 {id:'benchdip', name:'Dipy o lavičku',       emo:'🪑', cat:'push', lvl:0, unit:'r', harder:'dips', tip:'Ruce za tělem na lavičce. Lehčí varianta dipů, lokty táhni dozadu.'},
 {id:'pullup',   name:'Shyby',                emo:'🧗', cat:'pull', lvl:2, unit:'r', easier:'negpull', harder:'muscleup', tip:'Nadhmat, z plného visu bradou nad tyč. Žádné kopání nohama.'},
 {id:'chinup',   name:'Shyby podhmatem',      emo:'💪', cat:'pull', lvl:2, unit:'r', easier:'negpull', tip:'Podhmat víc zapojí biceps. Plný rozsah, kontrolovaně dolů.'},
 {id:'negpull',  name:'Negativní shyby',      emo:'🐌', cat:'pull', lvl:1, unit:'r', easier:'auspull', harder:'pullup', tip:'Vyskoč nahoru a co nejpomaleji (5+ s) klesej. Cesta k prvnímu shybu.'},
 {id:'auspull',  name:'Australské shyby',     emo:'🇦🇺', cat:'pull', lvl:0, unit:'r', harder:'negpull', tip:'Tyč v úrovni pasu, tělo šikmo pod ní, přitahuj hrudník k tyči.'},
 {id:'muscleup', name:'Muscle-up progrese',   emo:'🚀', cat:'pull', lvl:3, unit:'r', easier:'pullup', tip:'Výbušný shyb až k hrudníku + přechod přes tyč.'},
 {id:'hang',     name:'Vis na hrazdě (výdrž)',emo:'🐒', cat:'pull', lvl:0, unit:'s', harder:'auspull', tip:'Aktivní vis, ramena od uší. Buduje úchop a zdravá ramena.'},
 {id:'squat',    name:'Dřepy',                emo:'🦿', cat:'legs', lvl:0, unit:'r', harder:'jsquat', tip:'Paty na zemi, kolena ve směru špiček, dolů pod rovnoběžku.'},
 {id:'jsquat',   name:'Dřepy s výskokem',     emo:'🦘', cat:'legs', lvl:1, unit:'r', easier:'squat', harder:'pistol', tip:'Z dřepu výbušně vyskoč, doskok do měkkých kolen.'},
 {id:'lunge',    name:'Výpady',               emo:'🚶', cat:'legs', lvl:1, unit:'r', harder:'pistol', tip:'Dlouhý krok vpřed, zadní koleno těsně nad zem, trup vzpřímený.'},
 {id:'pistol',   name:'Pistol squat progrese',emo:'🔫', cat:'legs', lvl:3, unit:'r', easier:'jsquat', tip:'Dřep na jedné noze. Začni na lavičku nebo s přidržením.'},
 {id:'plank',    name:'Plank',                emo:'🧱', cat:'core', lvl:0, unit:'s', harder:'hollow', tip:'Lokty pod rameny, zpevněný zadek i břicho, žádný prohnutý hřbet.'},
 {id:'hollow',   name:'Hollow body hold',     emo:'🌙', cat:'core', lvl:1, unit:'s', easier:'plank', harder:'lsit', tip:'Leh na zádech, bedra do země, nohy a lopatky nad zemí.'},
 {id:'legraise', name:'Zvedání nohou ve visu',emo:'🦶', cat:'core', lvl:2, unit:'r', easier:'hollow', harder:'lsit', tip:'Ve visu zvedej natažené nohy k tyči. Lehčí: kolena k hrudi.'},
 {id:'lsit',     name:'L-sit (výdrž)',        emo:'📐', cat:'core', lvl:3, unit:'s', easier:'legraise', tip:'Vzpor na bradlech/zemi, nohy natažené před tebou.'},
 {id:'burpee',   name:'Burpees',              emo:'🔥', cat:'full', lvl:1, unit:'r', tip:'Klik + výskok. Kondiční zabiják, drž tempo a techniku.'},
];
const CATS = {push:'Tlaky', pull:'Tahy', legs:'Nohy', core:'Core', full:'Celé tělo', own:'Vlastní'};
const LVLN = ['Začátečník','Mírně pokročilý','Pokročilý','Expert'];
const EX_EMOJIS = ['⭐','🤜','🧗','🆙','🦿','🧱','🐒','🏹','🚀','🤸','🔥','💪','🦵','🦶','📐','🌙','🪑','🏃','🥊','🎯','🐢','⚡','🪨','🦍'];
const MEAL_EMOJIS = ['🍽️','🥣','🍛','🍳','🍌','🥤','🍓','🍗','🥛','🐟','🥚','🥪','🫘','🍚','🥩','🥗','🍝','🌯','🥞','🧀','🍞','🥜','🍎','🍫'];

/* ---------- rozcvička ---------- */
const WARMUP = [
 '30 s poskoky / jumping jacks (zahřátí)',
 '10× kroužení rameny dopředu i dozadu',
 '10× kroužení zápěstími a lokty',
 '10 dřepů bez zátěže',
 '10-15 s vis na hrazdě (protažení ramen)',
];

/* ---------- preset jídla ---------- */
const MEALS = [
 {id:'m1', name:'Ovesná kaše s banánem a arašídovým máslem', emo:'🥣', when:'pre',  p:18, kcal:520, note:'60-90 min před tréninkem. Pomalé sacharidy = stabilní energie.'},

function load(){

  };
}
function save(){
  try{ localStorage.setItem(DB, JSON.stringify(S)); }
  catch(e){ /* localStorage blokované (sandbox/soukromé okno) - app pojede dál, jen neuloží po zavření */ }

const today = ()=> new Date().toISOString().slice(0,10);
const fmtD = d => { const x=new Date(d); return x.getDate()+'. '+(x.getMonth()+1)+'.'; };
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function monday(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
function weekStats(){
  const m=monday();
  const wk=S.workouts.filter(w=>w.date>=m).length;
  let xp=0; Object.keys(S.xpLog).forEach(k=>{ if(k>=m) xp+=S.xpLog[k]; });
  return {wk,xp};
}
function proteinDays(s){
  if(!s.profile) return 0;
  const target = Math.round(latestWeight()*(s.profile.goal==='fit'?1.6:2.0));
  let n=0;
  Object.keys(s.foodLog).forEach(d=>{
    const sum=s.foodLog[d].reduce((a,f)=>a+f.p,0);
    if(sum>=target) n++;
  });
  return n;
}

/* ---------- XP + streak + odznaky ---------- */
function levelInfo(){
  let li=0; LEVELS.forEach((l,i)=>{ if(S.xp>=l.xp) li=i; });
  const cur=LEVELS[li], next=LEVELS[li+1];
  const pct = next ? Math.min(100,Math.round((S.xp-cur.xp)/(next.xp-cur.xp)*100)) : 100;
  return {i:li, cur, next, pct};
}
function addXp(n, msg){
  S.xp += n;
  const t=today(); S.xpLog[t]=(S.xpLog[t]||0)+n;
  touchStreak(); save(); renderHeader();
  toast((msg||'+'+n+' XP')+' ⚡');
}
function touchStreak(){
  const t = today();
  if(S.streak.last===t) return;
  if(S.streak.last && daysBetween(S.streak.last,t)===1) S.streak.count++;
  else S.streak.count = 1;
  S.streak.last = t;
}

function planFor(profile){
  const lv = profile.level;
  const goal = profile.goal;
  const reps = goal==='lose' ? 'co nejvíc opakování, pauza jen 45-60 s'
             : goal==='gain' ? 'těžší varianty, 6-12 opakování, pauza 90-120 s'
             : '8-15 opakování, pauza 60-90 s';
  const pick = ids => ids.map(id=>EXERCISES.find(e=>e.id===id));
  let A,B,C;
  if(lv===0){
    A = pick(['kneepush','benchdip','squat','plank']);
    B = pick(['auspull','hang','lunge','hollow']);
    C = pick(['kneepush','auspull','squat','plank','burpee']);
  }else if(lv===1){
    A = pick(['pushup','benchdip','pikepush','plank']);
    B = pick(['negpull','auspull','jsquat','hollow']);
    C = pick(['pushup','negpull','lunge','burpee','hollow']);
  }else{
    A = pick(['pushup','dips','pikepush','lsit']);
    B = pick(['pullup','chinup','jsquat','legraise']);
    C = pick(['declpush','pullup','pistol','burpee','hollow']);
  }
  return {A,B,C, reps,
    days:'Pondělí (A) / Středa (B) / Pátek (C)',
    note: goal==='lose'
      ? 'Cíl: zhubnout. Jedeš kruhově, krátké pauzy, klidně přidej 20-30 min chůze/běhu v netréninkové dny. Kalorie lehce pod výdejem, protein vysoko.'
      : goal==='gain'
      ? 'Cíl: nabrat. Jdi blízko selhání, postupně ztěžuj varianty cviků. Jez v lehkém nadbytku (+300 kcal), protein vysoko, spi 8 h.'
      : 'Cíl: být fit. Drž konzistenci 3x týdně, postupně přidávej opakování. Strava vyvážená, protein hlídej.'
  };
}
function nextWorkoutKey(){ return ['A','B','C'][S.workouts.length%3]; }
function isTrainingDay(){ const d=new Date().getDay(); return d===1||d===3||d===5; }

/* ---------- výživa ---------- */
function nutrition(){
  const p=S.profile;
  const w = latestWeight();
  const protMul = p.goal==='fit'?1.6:2.0;
  const protein = Math.round(w*protMul);
  const bmr = 10*w + 6.25*p.height - 5*p.age + 5;
  let kcal = Math.round(bmr*1.55/10)*10;
  if(p.goal==='gain') kcal+=300;
  if(p.goal==='lose') kcal-=400;
  return {protein,kcal,w};
}
function latestWeight(){
  if(S.weights.length) return S.weights[S.weights.length-1].kg;
  return S.profile ? S.profile.weight : 70;
}
function lastSets(name){
  for(let i=S.workouts.length-1;i>=0;i--){
    const e=(S.workouts[i].ex||[]).find(x=>x.name===name);
    if(e) return {date:S.workouts[i].date, sets:e.sets, unit:e.unit||'r'};
  }
  return null;
}

function exportBackup(){
  const c='KALIFULL.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));

  else prompt('Zkopíruj zálohu:', c);

function importBackup(){
  const raw=document.getElementById('stImport').value.trim();
  if(!raw.startsWith('KALIFULL.')){ toast('To není záloha KaliSquad 🤔'); return; }
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(raw.slice(9)))));
    if(!d.profile) throw 0;
    localStorage.setItem(DB, JSON.stringify(d));
    S=load(); save(); closeModal(); render(); toast('Záloha obnovena ✅');
  }catch(e){ toast('Zálohu se nepodařilo načíst 😕'); }
}
function resetAll(){

function startRest(s){ restEnd=Date.now()+s*1000;
  clearInterval(restInt); restInt=setInterval(tickRest,250); tickRest(); }
function tickRest(){
  const el=document.getElementById('restShow'); if(!el) return;
  if(!restEnd){ el.textContent='připraveno'; return; }
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){ el.textContent='✅ Jedeme další sérii!'; clearInterval(restInt); restEnd=null;
    if(navigator.vibrate) navigator.vibrate(300); return; }
  el.textContent=left+' s';
}
function addSet(i){
  const e=S.active.ex[i];
  const ls=lastSets(e.name);
  let val;
  if(ls && ls.sets[e.sets.length]!==undefined) val=ls.sets[e.sets.length];
  else if(e.sets.length) val=e.sets[e.sets.length-1].reps;
  else val=(e.unit==='s'?30:10);
  e.sets.push({reps:val}); save(); renderWorkout();
}

function delSet(i,si){ S.active.ex[i].sets.splice(si,1); save(); renderWorkout(); }

          <button class="btn sm danger" onclick="delCustomMeal('${m.id}')">✕</button>`:''}
        </div>
      </div>`).join('')}
    </div>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="openAddMeal()">+ Přidat vlastní jídlo</button>
  </div>`;
}
function setWater(n){
  const t=today();
  const cur=S.water[t]||0;
  S.water[t]=(n===cur)?n-1:n;
  if(S.water[t]>cur) addXp((S.water[t]-cur)*2,'Hydratace! +'+(S.water[t]-cur)*2+' XP');
  else save();
  renderFood();
}
function eat(id){
  const m=[...MEALS,...S.customMeals].find(x=>x.id===id);
  const t=today(); S.foodLog[t]=S.foodLog[t]||[];
  S.foodLog[t].push({name:m.name,emo:m.emo,p:m.p,kcal:m.kcal});
  save();
  const nut=nutrition();
  const eaten=S.foodLog[t].reduce((s,f)=>s+f.p,0);
  S.habits[t]=S.habits[t]||{};
  if(eaten>=nut.protein && !S.habits[t].protein){
    S.habits[t].protein=true;
    addXp(8,'Protein splněn! Návyk odškrtnut. +8 XP');
  } else {
    addXp(3,'Zapsáno! +3 XP');
  }
  checkAch(); renderFood();
}
function delFood(i){ S.foodLog[today()].splice(i,1); save(); renderFood(); }
function openAddMeal(editId){
  const m = editId ? S.customMeals.find(x=>x.id===editId) : null;
  pendingEmo = m ? m.emo : '🍽️';
  const sel = (v,x)=> v===x?'selected':'';
  modal(`<h2>${m?'Upravit jídlo':'Vlastní jídlo'}</h2>
    <label>Ikona</label>${emoPicker(MEAL_EMOJIS, pendingEmo)}
    <label>Název</label><input id="cmName" placeholder="např. Mamčina svíčková" value="${m?m.name:''}">
    <div class="grid2">
      <div><label>Protein (g)</label><input id="cmP" type="number" inputmode="numeric" placeholder="30" value="${m?m.p:''}"></div>
      <div><label>Kalorie (kcal)</label><input id="cmK" type="number" inputmode="numeric" placeholder="550" value="${m?(m.kcal||''):''}"></div>
    </div>
    <label>Kdy</label>
    <select id="cmWhen">
      <option value="any" ${m?sel(m.when,'any'):''}>Kdykoliv</option>
      <option value="pre" ${m?sel(m.when,'pre'):''}>Před tréninkem</option>
      <option value="post" ${m?sel(m.when,'post'):''}>Po tréninku</option></select>
    <div style="height:14px"></div>
    <button class="btn" onclick="saveCustomMeal('${editId||''}')">Uložit jídlo</button>`);
}
function saveCustomMeal(editId){
  const n=document.getElementById('cmName').value.trim();
  const p=+document.getElementById('cmP').value;
  if(!n||!p){ toast('Doplň název a protein'); return; }
  const data={name:n, emo:pendingEmo||'🍽️', p,
    kcal:+document.getElementById('cmK').value||0,
    when:document.getElementById('cmWhen').value, own:true};
  const m = editId ? S.customMeals.find(x=>x.id===editId) : null;
  if(m){ Object.assign(m,data); save(); closeModal(); toast('Jídlo upraveno ✅'); }
  else { S.customMeals.push({id:'cm'+Date.now(), ...data});
    save(); closeModal(); addXp(5,'Nové jídlo! +5 XP'); }
  renderFood();
}
function delCustomMeal(id){ S.customMeals=S.customMeals.filter(m=>m.id!==id); save(); renderFood(); }

/* =====================================================
   PROGRES
   ===================================================== */
function renderProgress(){
  const p=S.profile;
  const lastTest=S.maxTests[S.maxTests.length-1];
  const testDue=!lastTest||daysBetween(lastTest.date,today())>=14;
  const w=latestWeight();
  const wDiff = p.targetWeight - w;
  const histo = S.workouts.map((wo,i)=>({wo,i})).reverse().slice(0,15);
  app.innerHTML=`
  <h1>Progres 📈</h1>

  <div class="grid2">
    <div class="statmini"><div class="v">${S.workouts.length}</div><div class="l">tréninků celkem</div></div>
    <div class="statmini"><div class="v">${S.workouts.reduce((s,x)=>s+x.sets,0)}</div><div class="l">sérií celkem</div></div>
  </div>

  <div class="card wood">
    <div class="row"><h2 class="grow" style="margin:0">🏆 Max testy</h2>
      ${testDue?'<span class="pill o">je čas na test!</span>':`<span class="pill">další za ${14-daysBetween(lastTest.date,today())} dní</span>`}</div>
    <p class="sub">Jednou za 2 týdny: max kliky, shyby a dipy v jedné sérii.</p>
    ${S.maxTests.length?chartMax():'<p class="sub">Zatím žádný test. Dej první, ať máš startovní čáru! 🏁</p>'}
    <div style="height:8px"></div>
    <button class="btn ${testDue?'':'sec'}" onclick="openMaxTest()">Zapsat max test</button>
  </div>

  <div class="card">
    <div class="row"><h2 class="grow" style="margin:0">⚖️ Váha</h2>
      <span class="pill ${Math.abs(wDiff)<1?'g':''}">${w} kg → cíl ${p.targetWeight} kg</span></div>
    ${S.weights.length>1?chartWeight():'<p class="sub">Zapisuj váhu cca 1x týdně, ráno nalačno.</p>'}
    <div class="row" style="margin-top:10px">
      <input id="wIn" type="number" inputmode="decimal" placeholder="váha v kg" style="flex:1">
      <button class="btn sm" style="width:auto" onclick="logWeight()">Zapsat</button>
    </div>
  </div>

  <div class="card">
    <h2>🏅 Odznaky (${S.ach.length}/${ACH.length})</h2>
    <div class="achgrid">
      ${ACH.map(a=>{
        const has=S.ach.includes(a.id);
        return `<div class="ach ${has?'':'lock'}"><div class="e">${has?a.emo:'🔒'}</div><div class="n">${a.name}</div></div>`;
      }).join('')}
    </div>
  </div>

  <div class="card">
    <h2>📜 Historie tréninků</h2>
    ${histo.length?`<div class="list">${histo.map(({wo,i})=>`
      <div class="item">
        <div class="emo">${wo.feel?['😵','😮‍💨','🙂','💪','🤩'][wo.feel-1]:'🏋️'}</div>
        <div class="grow"><b>Trénink ${wo.key}</b> <span class="pill">${fmtD(wo.date)}</span>
          <div class="sub" style="margin:2px 0 0">${wo.mins} min · ${wo.sets} sérií · ${wo.ex.map(e=>e.emo+' '+e.sets.join('/')+(e.unit==='s'?'s':'')).join(' · ')}</div>
        </div>
        <button class="btn sm danger" onclick="delWorkout(${i})">✕</button>
      </div>`).join('')}</div>`
    :'<p class="sub">Zatím prázdno. První trénink na tebe čeká v záložce Trénink. 💪</p>'}
  </div>`;
}
function delWorkout(i){
  if(confirm('Smazat tento trénink z historie?')){
    S.workouts.splice(i,1); save(); renderProgress();
  }
}
function logWeight(){
  const v=+document.getElementById('wIn').value;
  if(!v||v<30||v>250){ toast('Zadej reálnou váhu 🙂'); return; }
  S.weights.push({date:today(),kg:v}); save();
  addXp(5,'Váha zapsána! +5 XP'); checkAch(); renderProgress();
}
function openMaxTest(){
  modal(`<h2>🏆 Max test</h2>
    <p class="sub">Pořádně se rozcvič. Pak jedna série na maximum u každého cviku. Mezi cviky pauza 3-5 min.</p>
    <label>🤜 Max kliky</label><input id="mtPush" type="number" inputmode="numeric" placeholder="0">
    <label>🧗 Max shyby</label><input id="mtPull" type="number" inputmode="numeric" placeholder="0">
    <label>🆙 Max dipy</label><input id="mtDip" type="number" inputmode="numeric" placeholder="0">
    <div style="height:14px"></div>
    <button class="btn" onclick="saveMaxTest()">Uložit test ⚡</button>`);
}
function saveMaxTest(){
  const t={date:today(),
    push:+document.getElementById('mtPush').value||0,
    pull:+document.getElementById('mtPull').value||0,
    dip:+document.getElementById('mtDip').value||0};
  const prev=S.maxTests;
  if(prev.length){
    const best={push:Math.max(...prev.map(x=>x.push)), pull:Math.max(...prev.map(x=>x.pull)), dip:Math.max(...prev.map(x=>x.dip))};
    if(t.push>best.push||t.pull>best.pull||t.dip>best.dip){ S.flags.pr=true; }
  }
  S.maxTests.push(t); save(); closeModal(); confetti();
  addXp(40,'Max test hotový! +40 XP');
  if(t.pull>=5 && S.profile.level<2) toast('5+ shybů! Zvaž vyšší úroveň v ⚙️ nastavení 😎');
  go('progress');
  checkAch();
}
/* ---------- SVG grafy ---------- */
function lineChart(series, labels, colors, names){
  const W=560,H=200,P=34;
  const allV=series.flat();
  const max=Math.max(5,...allV)*1.15, min=Math.max(0,Math.min(...allV)*0.85);
  const n=labels.length;
  const x=i=> n===1? W/2 : P+ i*(W-P-10)/(n-1);
  const y=v=> H-26-(v-min)/(max-min)*(H-50);
  let out=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:300px">`;
  for(let g=0;g<4;g++){ const gy=24+g*(H-50)/3;
    out+=`<line x1="${P}" y1="${gy}" x2="${W-10}" y2="${gy}" stroke="#2b3d2c" stroke-width="1"/>`; }
  series.forEach((sv,si)=>{
    const pts=sv.map((v,i)=>x(i)+','+y(v)).join(' ');
    out+=`<polyline points="${pts}" fill="none" stroke="${colors[si]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    sv.forEach((v,i)=>{ out+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${colors[si]}"/>
      <text x="${x(i)}" y="${y(v)-9}" fill="${colors[si]}" font-size="11" font-weight="700" text-anchor="middle">${v}</text>`; });
  });
  labels.forEach((l,i)=>{ out+=`<text x="${x(i)}" y="${H-6}" fill="#9cab94" font-size="10.5" text-anchor="middle">${l}</text>`; });
  out+='</svg></div>';
  if(names) out+=`<p class="sub center" style="margin-top:4px">${names.map((nm,i)=>`<span style="color:${colors[i]};font-weight:700">● ${nm}</span>`).join(' &nbsp; ')}</p>`;
  return out;
}
function chartMax(){
  const t=S.maxTests.slice(-8);
  return lineChart(
    [t.map(x=>x.push),t.map(x=>x.pull),t.map(x=>x.dip)],
    t.map(x=>fmtD(x.date)),
    ['#8fc878','#86aec2','#d99a5b'],
    ['Kliky','Shyby','Dipy']);
}
function chartWeight(){
  const w=S.weights.slice(-10);
  return lineChart([w.map(x=>x.kg)],w.map(x=>fmtD(x.date)),['#d9a441'],null);
}

/* =====================================================
   PARTA
   ===================================================== */
function renderSquad(){
  const ws=weekStats();
  const me={name:S.profile.name, xp:S.xp, streak:S.streak.count,
    lvl:levelInfo().cur.name, emo:levelInfo().cur.emo, wk:S.workouts.length, ww:ws.wk, me:true};
  const rows=[me,...S.friends].sort((a,b)=>b.xp-a.xp);
  app.innerHTML=`
  <h1>Parta 👥</h1>
  <p class="sub">Žebříček podle XP. Kdo maká, ten je nahoře. Žádné výmluvy. 😤</p>

  <div class="card wood">
    <h2>🏆 Žebříček</h2>
    <p class="sub">😈 Týdenní výzva: kdo dá do neděle nejvíc tréninků?</p>
    ${rows.map((f,i)=>`<div class="lb">
      <div class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'}</div>
      <div class="avatar">${(f.name||'?')[0].toUpperCase()}</div>
      <div class="grow"><b>${f.name}${f.me?' (ty)':''}</b>
        <div class="sub">${f.emo||''} ${f.lvl||''} · ${f.wk||0} tréninků${f.ww!==undefined?' · tento týden '+f.ww:''} · 🔥 ${f.streak||0}</div></div>
      <div style="text-align:right"><b class="acc">⚡ ${f.xp}</b>
        ${!f.me?`<div><button class="btn sm danger" style="margin-top:4px" onclick="delFriend(${S.friends.indexOf(f)})">✕</button></div>`:''}</div>
    </div>`).join('')}
  </div>

  <div class="card flat">
    <h3>🔗 Pozvi kluky</h3>
    <p class="sub">Pošli jim odkaz na appku, ať nejedou sólo.</p>
    <button class="btn wood" onclick="shareApp()">Sdílet odkaz na appku 📲</button>
  </div>

  <div class="card">
    <h2>📲 Jak to funguje s partou</h2>
    <p class="sub">Appka běží každému v jeho mobilu (data jsou jen u tebe). Skóre si vyměňujete kódy:</p>
    <p class="sub">1. Pošli klukům odkaz na appku, každý si projde dotazník<br>
    2. Každý zkopíruje svůj kód níže a hodí ho do skupiny<br>
    3. Kódy ostatních sem vložíš a máš žebříček<br>
    4. Jednou za čas si pošlete nové kódy = aktualizace skóre</p>
    <div class="divider"></div>
    <h3>Můj kód</h3>
    <div class="codebox" id="myCode">${myCode()}</div>
    <div style="height:8px"></div>
    <button class="btn sec" onclick="copyCode()">Zkopírovat můj kód 📋</button>
    <div class="divider"></div>
    <h3>Přidat / aktualizovat kámoše</h3>
    <textarea id="frCode" placeholder="Sem vlož kód od kámoše..."></textarea>
    <div style="height:8px"></div>
    <button class="btn" onclick="addFriend()">Přidat do party ✚</button>
  </div>`;
}
function myCode(){
  const ws=weekStats();
  const d={n:S.profile.name, x:S.xp, s:S.streak.count, w:S.workouts.length, ww:ws.wk,
    l:levelInfo().cur.name, e:levelInfo().cur.emo};
  return 'KALI.'+btoa(unescape(encodeURIComponent(JSON.stringify(d))));
}
function copyCode(){
  const c=myCode();
  if(navigator.clipboard) navigator.clipboard.writeText(c).then(()=>toast('Zkopírováno! Pošli do skupiny 📲'));
  else toast('Označ a zkopíruj kód ručně');
}
function addFriend(){
  const raw=document.getElementById('frCode').value.trim();
  if(!raw.startsWith('KALI.')){ toast('To nevypadá jako KaliSquad kód 🤔'); return; }
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));
    if(!d.n) throw 0;
    const f={name:d.n, xp:d.x||0, streak:d.s||0, wk:d.w||0, ww:d.ww, lvl:d.l||'', emo:d.e||''};
    const ix=S.friends.findIndex(x=>x.name===f.name);
    if(ix>=0) S.friends[ix]=f; else S.friends.push(f);
    save(); toast(f.name+' je v partě! 🎉'); checkAch(); renderSquad();
  }catch(e){ toast('Kód se nepodařilo načíst 😕'); }
}
function delFriend(i){ if(i<0)return; S.friends.splice(i,1); save(); renderSquad(); }
function shareApp(){
  const url=location.href.split('#')[0];
  const text='Pojď cvičit kalisteniku s náma v KaliSquad 💪 '+url;
  if(navigator.share){ navigator.share({title:'KaliSquad', text:'Pojď cvičit kalisteniku s náma 💪', url}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('Odkaz zkopírován! Pošli klukům 📲')); }
  else prompt('Zkopíruj odkaz:', url);
}

/* =====================================================
   MODAL
   ===================================================== */
function modal(html, hideClose){
  closeModal();
  const bg=document.createElement('div'); bg.className='modalBg'; bg.id='modalBg';
  bg.onclick=e=>{ if(e.target===bg) closeModal(); };
  bg.innerHTML=`<div class="modal">${html}${hideClose?'':'<div style="height:6px"></div><button class="btn ghost" onclick="closeModal()">Zavřít</button>'}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById('modalBg'); if(m) m.remove(); }

/* ---------- start ---------- */
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
